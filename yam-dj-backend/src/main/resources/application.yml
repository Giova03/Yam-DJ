spring:
  application:
    name: yam-dj-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    # stringtype=unspecified : parametres String nulls envoyes en type inconnu,
    # PostgreSQL inferera le type selon le contexte — evite l'erreur classique
    # Hibernate 6 + PG "function lower(bytea) does not exist" sur les filtres
    # optionnels (q/genre/country) des le premier appel avec valeurs nulles.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      # Garde les connexions vivantes : evite la latence de re-ouverture
      # TCP+TLS vers Supabase (pooler eu-central-1) apres une periode d'inactivite.
      keepalive-time: 120000
      # Rejet d'une connexion mangee par un timeout cote pooler Supabase.
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # NB : pas de dialecte explicite — Hibernate 6 le deduit de la
        # datasource (evite le warning HHH90000025 au demarrage).
        format_sql: false
  sql:
    init:
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  # Compression HTTP (gzip) : reduit ~70 % du volume JSON — crucial pour
  # les connexions mobiles limitees d'Afrique de l'Ouest (2G/3G intermitente).
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/xml,text/plain,application/javascript,text/css,application/xml+rss
    min-response-size: 1024
  tomcat:
    # Threads limites (plan Render 0.1 CPU / 512 Mo) : moins de memoire,
    # file d'attente absorbee par la latence reseau plutot que par le CPU.
    threads:
      max: 50
      min-spare: 4
    accept-count: 100
    # Keep-alive des connexions HTTP : evite le handshake TCP/TLS complet
    # sur chaque appel API depuis le navigateur.
    keep-alive-timeout: 30000
  shutdown: graceful

yamdj:
  jwt:
    secret: ${JWT_SECRET:YamDjSuperSecretKey2024PourLaSecuriteDesTokensJWT256Bits minimum 32 caracteres!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  moderation:
    # Auto-approbation des uploads : true = les pistes publiees sont
    # IMMEDIATEMENT visibles (recommande en lancement V1). false = file
    # de moderation stricte (PENDING -> validation admin).
    auto-approve: ${YAMDJ_MODERATION_AUTO_APPROVE:true}
  youtube:
    # Cle YouTube Data API v3 OPTIONNELLE : sans cle, la recherche passe par
    # la page de resultats YouTube (ytInitialData) — aucune configuration requise.
    api-key: ${YOUTUBE_API_KEY:}
  supabase:
    # Bucket Storage du projet Supabase. Mode durable si SUPABASE_URL +
    # SUPABASE_SERVICE_KEY renseignes, sinon mode local (dossier de secours).
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:media}
  storage:
    # Mode secours : dossier local des medias quand Supabase Storage n'est pas configure
    local-dir: ${STORAGE_LOCAL_DIR:./yam-media}
  fedapay:
    # Paiement mobile money (Orange Money, Moov, MTN, Wave...)
    api-key: ${FEDAPAY_PUBLIC_KEY:}
    secret-key: ${FEDAPAY_SECRET_KEY:}
    base-url: ${FEDAPAY_BASE_URL:https://api.fedapay.com}
  premium:
    # Abonnement Fan Premium (Phase 3.1)
    price-xof: ${PREMIUM_PRICE_XOF:500}
    period-days: ${PREMIUM_PERIOD_DAYS:30}
  push:
    # Web Push (Phase 2.4). Cles VAPID P-256 en base64url : publique = 65
    # octets non compresses (0x04||x||y), privee = scalaire 32 octets.
    # Generer une seule fois puis renseigner sur Render (env vars).
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:contact@yamdj.africa}
  brevo:
    api-key: ${BREVO_API_KEY:}
    # IMPORTANT : utiliser un expediteur VERIFIE sur le compte Brevo
    # (dashboard Brevo > Senders). Un domaine non verifie est accepte par
    # l'API mais rejetee en silence par Gmail/Outlook (SPF/DKIM absents).
    sender: ${BREVO_SENDER:no-reply@yamdj.africa}
    sender-name: ${BREVO_SENDER_NAME:YAM DJ}
    base-url: https://api.brevo.com/v3
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200,https://yam-dj.vercel.app,https://yam-dj-frontend.vercel.app}
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}

logging:
  level:
    com.yamdj: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
