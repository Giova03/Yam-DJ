services:
  - type: web
    name: yam-dj-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: yam-dj-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.olzosqslfczqmadlixvr
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: SUPABASE_URL
        value: https://olzosqslfczqmadlixvr.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_BASE_URL
        value: https://api.fedapay.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      - key: BREVO_SENDER_NAME
        value: YAM DJ
      - key: CORS_ORIGINS
        value: https://yam-dj.vercel.app,https://yam-dj-frontend.vercel.app,http://localhost:4200
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://yam-dj-frontend.vercel.app
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
