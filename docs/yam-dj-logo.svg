<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="300" rx="36" fill="#14100C"/>
  <!-- icone (reduit) -->
  <g transform="translate(30,30) scale(0.47)">
    <circle cx="256" cy="256" r="228" fill="#221B15"/>
    <circle cx="256" cy="256" r="228" fill="none" stroke="url(#g)" stroke-width="6"/>
    <g fill="none" stroke="url(#gw)" stroke-width="2">
      <circle cx="256" cy="256" r="213" stroke-opacity="0.5"/><circle cx="256" cy="256" r="200" stroke-opacity="0.9"/>
      <circle cx="256" cy="256" r="186" stroke-opacity="0.6"/><circle cx="256" cy="256" r="172" stroke-opacity="1"/>
      <circle cx="256" cy="256" r="158" stroke-opacity="0.5"/>
    </g>
    <path d="M 60 256 A 196 196 0 0 0 256 452" fill="none" stroke="url(#g)" stroke-width="3" stroke-opacity="0.3"/>
    <circle cx="256" cy="256" r="108" fill="url(#g)"/>
    <g stroke="#14100C" stroke-width="34" stroke-linecap="round" fill="none">
      <path d="M199 176 L256 234"/><path d="M313 176 L256 234"/><path d="M256 278 L256 348"/>
    </g>
    <circle cx="256" cy="256" r="17" fill="#14100C"/>
    <circle cx="256" cy="256" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <!-- wordmark : YAM blanc + DJ degrade (echo du label du vinyle) -->
  <text x="318" y="185" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold"
        font-size="118" letter-spacing="2">
    <tspan fill="#FFFFFF">YAM</tspan><tspan fill="url(#gt)" dx="18">DJ</tspan>
  </text>
  <rect x="322" y="205" width="430" height="3" rx="1.5" fill="url(#gt)" opacity="0.6"/>
  <text x="322" y="248" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold"
        font-size="21" letter-spacing="9" fill="#FFFFFF" fill-opacity="0.62">LA MUSIQUE AFRICAINE QUI VIBRE</text>
  <!-- equalizer signature : ferme le bloc -->
  <g>
    <rect x="826" y="118" width="15" height="52" rx="7.5" fill="#FF6B35" opacity="0.9"/>
    <rect x="853" y="100" width="15" height="88" rx="7.5" fill="url(#gt)"/>
    <rect x="880" y="128" width="15" height="48" rx="7.5" fill="#FFD166" opacity="0.85"/>
    <rect x="907" y="110" width="15" height="72" rx="7.5" fill="url(#gt)" opacity="0.75"/>
    <rect x="934" y="140" width="15" height="34" rx="7.5" fill="#FF6B35" opacity="0.6"/>
  </g>
</svg>