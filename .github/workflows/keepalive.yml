# Keep-alive du backend Render (plan gratuit) — COUCHE SECOURS.
#
# ARCHITECTURE ANTI-VEILLE (3 couches redondantes) :
#   1. PRINCIPALE — cron Supabase pg_cron (job 'yamdj-keepalive', */5 min,
#      ponctuel et independant de GitHub : SELECT cron.schedule(...) — voir
#      scripts/supabase_keepalive_cron.py). Supabase est deja paye pour la
#      DB, le ping est gratuit et fiable.
#   2. SECOURS (ce workflow) — GitHub Actions : les crons programmes peuvent
#      etre retardes de ~2 h en periode de charge GitHub, mais chaque
#      execution re-pingue en boucle pendant ~9,5 min (couverture partielle).
#   3. RENFORCEMENT — heartbeat frontend (app.component) : ping 4 min quand
#      un visiteur a l'onglet ouvert.
# Plus l'interceptor HTTP frontend (retry 5 s + message 'serveur en reveil')
# pour absorber un eventuel cold start residuel.
#
# POURQUOI : sur le plan gratuit, Render endort le service apres ~15 min
# sans trafic. Au reveil, la premiere requete met 50-90 s (cold start) —
# c'est ce qui faisait echouer connexion, inscription, uploads et mixtapes.
#
# Si tu passes sur un plan payant Render (sans mise en veille), desactive
# ce workflow ET le cron Supabase (SELECT cron.unschedule('yamdj-keepalive');).

name: Keep-alive backend Render

on:
  schedule:
    # Deux crons decales (minutes impaires et paires+3) : 24 declenchements
    # possibles par heure, redondance maximale contre les retards GitHub.
    - cron: '1-59/6 * * * *'     # 1,7,13,19,25,31,37,43,49,55
    - cron: '3-59/6 * * * *'     # 3,9,15,21,27,33,39,45,51,57
  workflow_dispatch: {}   # bouton "Run workflow" pour tester manuellement

# Un seul pinger a la fois : le nouveau declenchement remplace l'ancien
# (coverage continue), pas de pile de jobs en retard.
concurrency:
  group: keepalive-pinger
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping continu du backend (8 minutes)
        run: |
          ping() {
            local t0=$(date +%s)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
                   -H 'User-Agent: YamDJ-KeepAlive/2.0 (GitHub Actions)' \
                   "https://yam-dj.onrender.com/api/ads/config?_=$t0")
            echo "  $(date -u '+%H:%M:%S') -> HTTP $code"
          }
          echo "Keep-alive demarre $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          for i in 1 2 3 4 5; do
            ping || true
            if [ "$i" -lt 5 ]; then sleep 115; fi   # ~9,5 min de coverage
          done
          echo "Keep-alive termine $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
