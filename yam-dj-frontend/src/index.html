  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9">
  <script>
    /* Anti-FOUC : applique le theme AVANT le boot Angular.
       Defaut = mode clair, choix persistant localStorage. */
    (function () {
      try {
        var t = localStorage.getItem('yam-theme') || 'light';
        if (t === 'light') document.documentElement.classList.add('light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#F6F7F9' : '#0A0A0A');
      } catch (e) { document.documentElement.classList.add('light'); }
    })();
  </script>
  <meta name="description" content="YAM DJ : streaming musical africain, studio DJ en ligne, charts hebdomadaires et soutien aux artistes par mobile money (Orange Money, Moov, MTN, Wave).">
